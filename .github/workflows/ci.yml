# Intégration continue.
#
# Deux étages : la qualité du code d'abord, la construction de l'image
# ensuite — inutile de construire une image à partir d'un code qui échoue.
#
# Les commandes lancées ici sont exactement celles du Makefile, donc celles
# que tu lances en local. C'est ce qui supprime les « ça marche chez moi ».

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: churn-app

jobs:
  qualite:
    name: Style et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le projet
        run: pip install -e ".[dev,app]"

      - name: Vérifier le style
        run: make lint

      - name: Lancer les tests
        run: PYTHONPATH=src pytest --cov=churn --cov-report=term-missing

  image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: qualite

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Construire ne suffit pas : une image peut se construire et ne jamais
      # démarrer. On la lance et on interroge le point de santé de Streamlit.
      - name: Vérifier que le conteneur répond
        run: |
          docker run -d --name churn-ci -p 8501:8501 ${{ env.IMAGE_NAME }}:ci
          for tentative in $(seq 1 40); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null; then
              echo "L'application répond après ${tentative} tentatives."
              docker rm -f churn-ci
              exit 0
            fi
            sleep 3
          done
          echo "L'application n'a jamais répondu. Journaux du conteneur :"
          docker logs churn-ci
          docker rm -f churn-ci
          exit 1

  publication:
    name: Publication sur Docker Hub
    runs-on: ubuntu-latest
    needs: image
    # Ne publie que depuis main, et seulement si la variable de dépôt
    # DOCKERHUB_USERNAME est renseignée. Sans elle, l'étage est ignoré au
    # lieu d'échouer — le dépôt reste donc utilisable par quiconque le clone.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DOCKERHUB_USERNAME != ''

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: S'authentifier
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
